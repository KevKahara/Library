<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
    <title>Library</title>
</head>

<body>

    <header>
        <h1 class="heading">LIBRARY</h1>
    </header>

    <main>

        <div class="btn-container">
            <button class="add-btn">+</button>
        </div>

        <div class="library-dialog-form">
            <dialog class="form-dialog">

                <form method="dialog" class="form-input">

                    <div class="book-details-title">Book Details:</div>

                    <div>
                        <label for="title-input">Book Title</label><br>
                        <input type="text" id="title-input" name="book-title"><br>
                    </div>

                    <div>
                        <label for="author-input">Author</label><br>
                        <input type="text" id="author-input" name="author-name"><br>
                    </div>

                    <div>
                        <label for="pages-input">Number Of Pages</label><br>
                        <input type="text" id="pages-input" name="number-of-pages">
                    </div>

                    <div>
                        <label for="isRead">Is it Read?</label>
                        <input type="radio" id="isRead-input" name="isRead">
                    </div>
                    
                    <button class="close-btn">CLOSE</button>
                    <button class="submit-btn">SUBMIT</button>

                </form>

            </dialog>

        </div>

        <div class="display">

        </div>
    </main>
</body>
</html>
